</div>
</sc-if>
</div>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:420},&quot;fields&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{key:string,label:string,type?:'text'|'select'|'daterange',options?:string[],placeholder?:string}[]&quot;},&quot;values&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string,string|{from?:string,to?:string}&gt;&quot;},&quot;search&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;searchPlaceholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Buscar…&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;columnOptions&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{key:string,label:string,checked:boolean}[]&quot;},&quot;onToggleColumn&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(key:string)=&gt;void&quot;},&quot;onSearchChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(q:string)=&gt;void&quot;},&quot;onApply&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(values:Record&lt;string,any&gt;)=&gt;void&quot;},&quot;onRemove&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(key:string)=&gt;void&quot;},&quot;onClear&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {

    const active = fields.filter(f => this.isSet(values[f.key]));
    return {
