// «Ir a una escena», «Volver al Back-office») y el celular de 390 px con SiriusAppInspector (sirius-app-inspector.js). Con «Ver también el
// portal del cliente», al lado se ve el portal del caso (SiriusPortalCaso) para comprobar lo que recibe el asegurado.
class Component extends DCLogic {
  state = { w: window.innerWidth, hh: window.innerHeight };
  componentDidMount() { this._r = () => this.setState({ w: window.innerWidth, hh: window.innerHeight }); window.addEventListener('resize', this._r); }

  renderVals() {
    const h = React.createElement, W = this.state.w, H = this.state.hh, movil = W <= 520, dos = !!this.props.cliente && !!this.props.ver && !!window.SiriusPortalCaso && !movil;

    const VL = window.SiriusAppVisitaLogic, G = VL ? VL.S.giro : { fis: 'v', bloqueo: false }, fisH = !movil && G.fis === 'h', pantH = fisH && !G.bloqueo, girado = fisH && G.bloqueo;

    const marco = (kids, lab, key, app) => { const kk = app ? kA : k, ancho = app && pantH ? 780 : 390, alto = app && pantH ? 390 : 780, gir = app && girado;
      return h('div', { key, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 } }, lab ? h('span', { style: { fontSize: 13, fontWeight: 700, color: '#44515f' } }, lab) : null,
      h('div', { 'data-marco-app': app ? (gir ? 'girado-bloqueo' : pantH ? 'horizontal' : 'vertical') : undefined, style: { width: movil ? '100%' : r((gir ? 780 : ancho) * kk), height: movil ? 'auto' : r((gir ? 390 : alto) * kk), flex: '0 0 auto', position: 'relative' } },
        h('div', { className: 'in-ph', style: movil ? { display: 'flex', flexDirection: 'column', minHeight: 'calc(100vh - 64px)' } : { width: ancho + 'px', height: alto + 'px', transform: gir ? 'scale(' + kk + ') translate(0,390px) rotate(-90deg)' : 'scale(' + kk + ')', transformOrigin: 'top left', display: 'flex', flexDirection: 'column', border: '10px solid #1b232d', borderRadius: '28px', overflow: 'hidden', background: '#FFFFFF', boxShadow: '0 12px 40px rgba(11,46,89,.18)', transition: 'transform .3s' } }, kids))); };

      h('span', { style: { fontSize: 13, color: '#44515f' } }, 'Solo en el prototipo · celular ' + (fisH ? 'horizontal' : 'vertical') + (girado ? ' · la pantalla no gira: la cámara endereza su interfaz' : ''))) : null;
    const bar = h('div', { key: 'bar', style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between', gap: '8px 16px', padding: '10px 16px', background: '#0B2E59', color: '#FFFFFF' } },
      h('span', { style: { display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 } }, h('span', { style: { fontSize: 14, fontWeight: 700 } }, 'App del inspector · lo que ve el inspector en su celular'), h('span', { style: { fontSize: 12, opacity: .85 } }, 'Solo en el prototipo · inspectores.asur.ec (PWA)')),
      h('span', { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } },
