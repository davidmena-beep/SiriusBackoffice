// Marco de celular de 390 px en escritorio; a pantalla completa en un celular. El componente vive en sirius-portal.js.
class Component extends DCLogic {
  state = { ready: false };
  componentDidMount() { const NS = 'AseguradoraDelSurDesignSystem_4fbf29'; this._poll = setInterval(() => { if (window[NS] && window[NS].Button && window.SIRIUS_SILUETAS && window.SiriusSiluetasUI) { clearInterval(this._poll); this.setState({ ready: true }); } }, 50); }
  componentWillUnmount() { clearInterval(this._poll); }
  renderVals() { const q = new URLSearchParams(location.search); return { ready: this.state.ready, loading: !this.state.ready, token: q.has('token') ? (q.get('token') || '') : (this.props.token ?? '20186-AI') }; }
}
</script>
